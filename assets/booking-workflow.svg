<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Hotel Google Ads: from intent to verified bookings</title><desc id="desc">Verify the hotel, build focused ads, verify saved settings, publish and diagnose, then measure confirmed bookings. Calls and clicks alone do not establish bookings.</desc>
<rect width="1200" height="490" rx="20" fill="#f3f6fb"/>
<g font-family="Calibri,Arial,sans-serif" fill="#18314c">
<text x="44" y="62" font-size="34" font-weight="700">Relevant searches → verified bookings</text>
<text x="44" y="98" font-size="20">A repeatable team workflow • illustrative process, not a result forecast</text>
<g fill="#ffffff" stroke="#ccd8e6" stroke-width="2"><rect x="44" y="140" width="200" height="205" rx="14"/><rect x="272" y="140" width="200" height="205" rx="14"/><rect x="500" y="140" width="200" height="205" rx="14"/><rect x="728" y="140" width="200" height="205" rx="14"/><rect x="956" y="140" width="200" height="205" rx="14"/></g>
<g font-size="23" font-weight="700"><text x="64" y="183">1. Verify</text><text x="292" y="183">2. Build</text><text x="520" y="183">3. Check</text><text x="748" y="183">4. Launch</text><text x="976" y="183">5. Measure</text></g>
<g font-size="19"><text x="64" y="225">Official property</text><text x="64" y="258">Booking journey</text><text x="64" y="291">Spend boundary</text><text x="292" y="225">Focused keywords</text><text x="292" y="258">Real room photos</text><text x="292" y="291">Correct phone</text><text x="520" y="225">Saved budget</text><text x="520" y="258">Only this hotel</text><text x="520" y="291">Screenshot proof</text><text x="748" y="225">Approval status</text><text x="748" y="258">Start date</text><text x="748" y="291">Ad diagnosis</text><text x="976" y="225">Qualified calls</text><text x="976" y="258">Booked stays</text><text x="976" y="291">Cost per booking</text></g>
<rect x="44" y="374" width="1112" height="74" rx="12" fill="#173e62"/><text x="68" y="420" font-size="23" fill="white">Review → change one hypothesis → verify again. Clicks alone are not bookings.</text>
</g></svg>
